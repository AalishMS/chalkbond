<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Minimum window with tabs</title>
    <link rel="stylesheet" href="../editor/tokens.css" />
    <link rel="stylesheet" href="shell-tokens.css" />
    <link rel="stylesheet" href="../editor/mockup.css" />
    <link rel="stylesheet" href="native.css" />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body class="desk">
    <div class="win" style="width: 960px; height: 671px">
      <div class="titlebar">
        <img class="app" src="app-icon-small.svg" alt="" /><span class="title"
          >esterification - Chalkbond</span
        >
        <span class="caption-btn"
          ><svg class="" aria-hidden="true"><use href="native.svg#win-min" /></svg></span
        ><span class="caption-btn"
          ><svg class="" aria-hidden="true"><use href="native.svg#win-max" /></svg></span
        ><span class="caption-btn"
          ><svg class="" aria-hidden="true"><use href="native.svg#win-close" /></svg
        ></span>
      </div>

      <div class="client">
        <div class="window is-compact has-tabs">
          <header class="topbar">
            <button
              class="btn btn-top btn-menu"
              id="menu-btn"
              data-testid="menu-button"
              aria-label="Menu"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg class="icon icon-20" aria-hidden="true"><use href="shell-icons.svg#menu" /></svg>
            </button>
            <label class="namefield"
              ><svg class="icon icon-20" aria-hidden="true">
                <use href="../editor/icons.svg#search" /></svg
              ><input
                type="text"
                aria-label="Compound name"
                placeholder="Type a compound name…"
                value=""
            /></label>
            <div class="divider-v" role="separator"></div>
            <div class="options" role="toolbar" aria-label="Tool options">
              <button class="btn btn-opt text" id="opt-C" aria-label="Carbon" aria-pressed="true">
                C
              </button>
              <button
                class="btn btn-opt text"
                id="opt-H"
                aria-label="Hydrogen"
                aria-pressed="false"
              >
                H
              </button>
              <button
                class="btn btn-opt text"
                id="opt-N"
                aria-label="Nitrogen"
                aria-pressed="false"
              >
                N
              </button>
              <button class="btn btn-opt text" id="opt-O" aria-label="Oxygen" aria-pressed="false">
                O
              </button>
              <button class="btn btn-opt text" id="opt-S" aria-label="Sulfur" aria-pressed="false">
                S
              </button>
              <button
                class="btn btn-opt text"
                id="opt-P"
                aria-label="Phosphorus"
                aria-pressed="false"
              >
                P
              </button>
              <button
                class="btn btn-opt text"
                id="opt-F"
                aria-label="Fluorine"
                aria-pressed="false"
              >
                F
              </button>
              <button
                class="btn btn-opt text"
                id="opt-Cl"
                aria-label="Chlorine"
                aria-pressed="false"
              >
                Cl
              </button>
              <button
                class="btn btn-opt text"
                id="opt-Br"
                aria-label="Bromine"
                aria-pressed="false"
              >
                Br
              </button>
              <button class="btn btn-opt text" id="opt-I" aria-label="Iodine" aria-pressed="false">
                I
              </button>
              <div class="options-sep" role="separator"></div>
              <button
                class="btn btn-opt"
                id="opt-mark-plus"
                aria-label="Positive charge"
                aria-pressed="false"
              >
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#mark-plus" />
                </svg>
              </button>
              <button
                class="btn btn-opt"
                id="opt-mark-minus"
                aria-label="Negative charge"
                aria-pressed="false"
              >
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#mark-minus" />
                </svg>
              </button>
              <button
                class="btn btn-opt"
                id="opt-mark-lone-pair"
                aria-label="Lone pair"
                aria-pressed="false"
              >
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#mark-lone-pair" />
                </svg>
              </button>
              <button
                class="btn btn-opt"
                id="opt-mark-radical"
                aria-label="Radical"
                aria-pressed="false"
              >
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#mark-radical" />
                </svg>
              </button>
              <button
                class="btn btn-opt text"
                aria-label="Partial positive charge"
                aria-pressed="false"
              >
                δ+
              </button>
              <button
                class="btn btn-opt text"
                aria-label="Partial negative charge"
                aria-pressed="false"
              >
                δ−
              </button>
            </div>
            <div class="history">
              <button class="btn btn-top" id="undo" aria-label="Undo (Ctrl+Z)">
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#undo" />
                </svg>
              </button>
              <button class="btn btn-top" id="redo" aria-label="Redo (Ctrl+Y)" aria-disabled="true">
                <svg class="icon icon-20" aria-hidden="true">
                  <use href="../editor/icons.svg#redo" />
                </svg>
              </button>
            </div>
            <button
              class="btn btn-copy is-compact"
              id="copy"
              data-testid="copy"
              aria-label="Copy (Ctrl+C)"
            >
              <span aria-hidden="true">Copy</span>
            </button>
          </header>
          <nav class="rail" role="toolbar" aria-orientation="vertical" aria-label="Tools">
            <button
              class="btn btn-rail"
              id="tool-select"
              aria-label="Select"
              aria-keyshortcuts="1 V"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">1</span
              ><svg class="icon" aria-hidden="true"><use href="../editor/icons.svg#select" /></svg
              ><span class="rail-caption" aria-hidden="true">Select</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-erase"
              aria-label="Erase"
              aria-keyshortcuts="2 E"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">2</span
              ><svg class="icon" aria-hidden="true"><use href="../editor/icons.svg#erase" /></svg
              ><span class="rail-caption" aria-hidden="true">Erase</span>
            </button>
            <div class="rail-sep" role="separator"></div>
            <button
              class="btn btn-rail"
              id="tool-bond"
              aria-label="Bond"
              aria-keyshortcuts="3 B"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">3</span
              ><svg class="icon" aria-hidden="true">
                <use href="../editor/icons.svg#bond-single" /></svg
              ><span class="rail-caption" aria-hidden="true">Bond</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-chain"
              aria-label="Chain"
              aria-keyshortcuts="4 Z"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">4</span
              ><svg class="icon" aria-hidden="true"><use href="../editor/icons.svg#chain" /></svg
              ><span class="rail-caption" aria-hidden="true">Chain</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-ring"
              aria-label="Ring"
              aria-keyshortcuts="5 R"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">5</span
              ><svg class="icon" aria-hidden="true">
                <use href="../editor/icons.svg#ring-benzene" /></svg
              ><span class="rail-caption" aria-hidden="true">Ring</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-atom"
              aria-label="Atom"
              aria-keyshortcuts="6 L"
              aria-pressed="true"
            >
              <span class="rail-key" aria-hidden="true">6</span><span class="rail-glyph">C</span
              ><span class="rail-caption" aria-hidden="true">Atom</span>
            </button>
            <div class="rail-sep" role="separator"></div>
            <button
              class="btn btn-rail"
              id="tool-arrow"
              aria-label="Arrow"
              aria-keyshortcuts="7 A"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">7</span
              ><svg class="icon" aria-hidden="true">
                <use href="../editor/icons.svg#arrow-forward" /></svg
              ><span class="rail-caption" aria-hidden="true">Arrow</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-plus"
              aria-label="Plus"
              aria-keyshortcuts="8 Plus"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">8</span
              ><svg class="icon" aria-hidden="true"><use href="../editor/icons.svg#plus" /></svg
              ><span class="rail-caption" aria-hidden="true">Plus</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-curved"
              aria-label="Curved arrow"
              aria-keyshortcuts="9 M"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">9</span
              ><svg class="icon" aria-hidden="true">
                <use href="../editor/icons.svg#curved-full" /></svg
              ><span class="rail-caption" aria-hidden="true">Curly</span>
            </button>
            <button
              class="btn btn-rail"
              id="tool-text"
              aria-label="Text"
              aria-keyshortcuts="0 T"
              aria-pressed="false"
            >
              <span class="rail-key" aria-hidden="true">0</span
              ><svg class="icon" aria-hidden="true"><use href="../editor/icons.svg#text" /></svg
              ><span class="rail-caption" aria-hidden="true">Text</span>
            </button>
          </nav>
          <div class="tabstrip">
            <div class="tabs" role="tablist" aria-label="Open drawings">
              <div
                class="tab"
                role="tab"
                aria-selected="true"
                tabindex="0"
                aria-label="esterification"
              >
                <span class="tab-title">esterification</span
                ><button class="tab-close" tabindex="-1" aria-label="Close esterification (Ctrl+W)">
                  <svg class="icon icon-16" aria-hidden="true">
                    <use href="shell-icons.svg#close" />
                  </svg>
                </button>
              </div>
              <div class="tab" role="tab" aria-selected="false" tabindex="-1" aria-label="ethanol">
                <span class="tab-title">ethanol</span
                ><button class="tab-close" tabindex="-1" aria-label="Close ethanol (Ctrl+W)">
                  <svg class="icon icon-16" aria-hidden="true">
                    <use href="shell-icons.svg#close" />
                  </svg>
                </button>
              </div>
              <div
                class="tab"
                role="tab"
                aria-selected="false"
                tabindex="-1"
                aria-label="Untitled 2, not saved as a file yet"
              >
                <span class="tab-dot" aria-hidden="true"></span
                ><span class="tab-title">Untitled 2</span
                ><button class="tab-close" tabindex="-1" aria-label="Close Untitled 2 (Ctrl+W)">
                  <svg class="icon icon-16" aria-hidden="true">
                    <use href="shell-icons.svg#close" />
                  </svg>
                </button>
              </div>
            </div>
            <button class="btn tab-add" id="tab-add" aria-label="New tab (Ctrl+T)">
              <svg class="icon icon-20" aria-hidden="true"><use href="shell-icons.svg#add" /></svg>
            </button>
          </div>
          <main class="canvas" role="application" aria-label="Drawing canvas">
            <img class="canvas-art" src="canvas/min-tabs.svg" alt="" />
          </main>
          <footer class="statusbar">
            <div class="hint" role="status" aria-live="polite">
              Click an atom to change it. Click empty space to add an atom.
            </div>
            <div class="segmented" role="group" aria-label="Style">
              <button class="btn btn-status" id="preset-slides" aria-pressed="true">Slides</button
              ><button class="btn btn-status" id="preset-handout" aria-pressed="false">
                Handout
              </button>
            </div>
            <div class="zoom">
              <button class="btn btn-status" id="zoom-out" aria-label="Zoom out (Ctrl+−)">
                <svg class="icon icon-16" aria-hidden="true">
                  <use href="../editor/icons.svg#zoom-out" />
                </svg></button
              ><button class="btn btn-status btn-zoom" id="zoom-100" aria-label="Zoom to 100%">
                83%</button
              ><button class="btn btn-status" id="zoom-in" aria-label="Zoom in (Ctrl+=)">
                <svg class="icon icon-16" aria-hidden="true">
                  <use href="../editor/icons.svg#zoom-in" />
                </svg></button
              ><button class="btn btn-status" id="zoom-fit" aria-label="Zoom to fit (Ctrl+0)">
                <svg class="icon icon-16" aria-hidden="true">
                  <use href="../editor/icons.svg#fit" />
                </svg>
              </button>
            </div>
          </footer>
        </div>
      </div>
    </div>

    <p class="native-note" style="top: 709px">
      <b>Minimum window:</b> content area 960 × 640 (window 960 × 671: the menu bar is gone), with
      the Atom tool, the widest options bar. Native title bar approximate.
    </p>
    <script src="shell.js"></script>
  </body>
</html>
