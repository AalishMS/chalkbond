<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Stand-ins for Windows 11 system glyphs in the native approximations (title bar, menus,
  message boxes). Not part of the app: Windows draws these itself.
-->
<symbol id="win-min" viewBox="0 0 10 10">
  <path d="M0 5.5H10" fill="none" stroke="currentColor" stroke-width="1"/>
</symbol>
<symbol id="win-max" viewBox="0 0 10 10">
  <rect x="0.5" y="0.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/>
</symbol>
<symbol id="win-close" viewBox="0 0 10 10">
  <path d="M0.5 0.5L9.5 9.5M9.5 0.5L0.5 9.5" fill="none" stroke="currentColor" stroke-width="1"/>
</symbol>
<symbol id="menu-chevron" viewBox="0 0 16 16">
  <path d="M6 3.5L10.5 8L6 12.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="menu-radio" viewBox="0 0 16 16">
  <circle cx="8" cy="8" r="3" fill="currentColor"/>
</symbol>
<symbol id="mb-warning" viewBox="0 0 32 32">
  <path d="M16 3.5C16.9 3.5 17.6 4 18.1 4.8L29.6 25.3C30.5 26.9 29.4 28.5 27.6 28.5H4.4C2.6 28.5 1.5 26.9 2.4 25.3L13.9 4.8C14.4 4 15.1 3.5 16 3.5Z" fill="#FFC83D" stroke="#C78E00" stroke-width="1"/>
  <path d="M16 10.5V19.5" stroke="#1F1F1F" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="23.8" r="1.6" fill="#1F1F1F"/>
</symbol>
<symbol id="mb-info" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="13.5" fill="#0F6CBD" stroke="#0A4E8A" stroke-width="1"/>
  <path d="M16 14.5V23" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="9.8" r="1.7" fill="#FFFFFF"/>
</symbol>
<symbol id="mb-error" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="13.5" fill="#D13438" stroke="#A4262C" stroke-width="1"/>
  <path d="M11 11L21 21M21 11L11 21" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
</symbol>
</svg>
