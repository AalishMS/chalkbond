<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atom options</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="mockup.css" />
  </head>
  <body>
    <div class="window">
      <header class="topbar">
        <label class="namefield"
          ><svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#search" /></svg
          ><input
            type="text"
            aria-label="Compound name"
            placeholder="Type a compound name…"
            value=""
        /></label>
        <div class="divider-v" role="separator"></div>
        <div class="options" role="toolbar" aria-label="Tool options">
          <button class="btn btn-opt text" id="opt-C" aria-label="Carbon" aria-pressed="false">
            C
          </button>
          <button class="btn btn-opt text" id="opt-H" aria-label="Hydrogen" aria-pressed="false">
            H
          </button>
          <button class="btn btn-opt text" id="opt-N" aria-label="Nitrogen" aria-pressed="true">
            N
          </button>
          <button class="btn btn-opt text" id="opt-O" aria-label="Oxygen" aria-pressed="false">
            O
          </button>
          <button class="btn btn-opt text" id="opt-S" aria-label="Sulfur" aria-pressed="false">
            S
          </button>
          <button class="btn btn-opt text" id="opt-P" aria-label="Phosphorus" aria-pressed="false">
            P
          </button>
          <button class="btn btn-opt text" id="opt-F" aria-label="Fluorine" aria-pressed="false">
            F
          </button>
          <button
            class="btn btn-opt text is-hover"
            id="opt-Cl"
            aria-label="Chlorine"
            aria-pressed="false"
          >
            Cl
          </button>
          <button class="btn btn-opt text" id="opt-Br" aria-label="Bromine" aria-pressed="false">
            Br
          </button>
          <button class="btn btn-opt text" id="opt-I" aria-label="Iodine" aria-pressed="false">
            I
          </button>
          <div class="options-sep" role="separator"></div>
          <button
            class="btn btn-opt"
            id="opt-mark-plus"
            aria-label="Positive charge"
            aria-pressed="false"
          >
            <svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#mark-plus" /></svg>
          </button>
          <button
            class="btn btn-opt"
            id="opt-mark-minus"
            aria-label="Negative charge"
            aria-pressed="false"
          >
            <svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#mark-minus" /></svg>
          </button>
          <button
            class="btn btn-opt"
            id="opt-mark-lone-pair"
            aria-label="Lone pair"
            aria-pressed="false"
          >
            <svg class="icon icon-20" aria-hidden="true">
              <use href="icons.svg#mark-lone-pair" />
            </svg>
          </button>
          <button
            class="btn btn-opt"
            id="opt-mark-radical"
            aria-label="Radical"
            aria-pressed="false"
          >
            <svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#mark-radical" /></svg>
          </button>
          <button
            class="btn btn-opt text"
            aria-label="Partial positive charge"
            aria-pressed="false"
          >
            δ+
          </button>
          <button
            class="btn btn-opt text"
            aria-label="Partial negative charge"
            aria-pressed="false"
          >
            δ−
          </button>
        </div>
        <div class="history">
          <button class="btn btn-top" id="undo" aria-label="Undo (Ctrl+Z)">
            <svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#undo" /></svg>
          </button>
          <button class="btn btn-top" id="redo" aria-label="Redo (Ctrl+Y)" aria-disabled="true">
            <svg class="icon icon-20" aria-hidden="true"><use href="icons.svg#redo" /></svg>
          </button>
        </div>
      </header>
      <nav class="rail" role="toolbar" aria-orientation="vertical" aria-label="Tools">
        <button class="btn btn-rail" id="tool-select" aria-label="Select (V)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#select" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-erase" aria-label="Erase (E)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#erase" /></svg>
        </button>
        <div class="rail-sep" role="separator"></div>
        <button class="btn btn-rail" id="tool-bond" aria-label="Bond (B)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#bond-single" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-chain" aria-label="Chain (Z)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#chain" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-ring" aria-label="Ring (R)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#ring-benzene" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-atom" aria-label="Atom (L)" aria-pressed="true">
          <span class="rail-glyph">N</span>
        </button>
        <div class="rail-sep" role="separator"></div>
        <button class="btn btn-rail" id="tool-arrow" aria-label="Arrow (A)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#arrow-forward" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-plus" aria-label="Plus (+)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#plus" /></svg>
        </button>
        <button
          class="btn btn-rail"
          id="tool-curved"
          aria-label="Curved arrow (M)"
          aria-pressed="false"
        >
          <svg class="icon" aria-hidden="true"><use href="icons.svg#curved-full" /></svg>
        </button>
        <button class="btn btn-rail" id="tool-text" aria-label="Text (T)" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#text" /></svg>
        </button>
      </nav>
      <main class="canvas" role="application" aria-label="Drawing canvas">
        <img class="canvas-art" src="canvas/05-atom-options.svg" alt="" />
      </main>
      <footer class="statusbar">
        <div class="hint" role="status" aria-live="polite">
          Click an atom to change it. Click empty space to add an atom.
        </div>
        <div class="formula" data-testid="formula">C₃H₈O · 60.10 g/mol</div>
        <div class="segmented" role="group" aria-label="Style">
          <button class="btn btn-status" id="preset-slides" aria-pressed="true">Slides</button
          ><button class="btn btn-status" id="preset-handout" aria-pressed="false">Handout</button>
        </div>
        <div class="zoom">
          <button class="btn btn-status" id="zoom-out" aria-label="Zoom out (Ctrl+−)">
            <svg class="icon icon-16" aria-hidden="true">
              <use href="icons.svg#zoom-out" />
            </svg></button
          ><button class="btn btn-status btn-zoom" id="zoom-100" aria-label="Zoom to 100% (Ctrl+1)">
            100%</button
          ><button class="btn btn-status" id="zoom-in" aria-label="Zoom in (Ctrl+=)">
            <svg class="icon icon-16" aria-hidden="true">
              <use href="icons.svg#zoom-in" />
            </svg></button
          ><button class="btn btn-status" id="zoom-fit" aria-label="Zoom to fit (Ctrl+0)">
            <svg class="icon icon-16" aria-hidden="true"><use href="icons.svg#fit" /></svg>
          </button>
        </div>
      </footer>
      <div class="tooltip" role="tooltip" data-for="opt-Cl" data-side="below">
        <div class="tooltip-title"><span>Chlorine</span></div>
        <div class="tooltip-help">Click an atom to make it Cl.</div>
      </div>
    </div>
    <script src="mockup.js"></script>
  </body>
</html>
