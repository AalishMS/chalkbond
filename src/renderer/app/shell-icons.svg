<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Chalkbond shell icon sprite (SPEC-app-shell.md "Visual language additions"). Same rules as
  ../editor/icons.svg: grid 24x24, stroke 1.5, round caps and joins, currentColor, 2 px safe
  margin. These symbols are additions; merge them into the editor sprite or icons.tsx.
  Use: <svg class="icon"><use href="shell-icons.svg#copy"/></svg>
-->

<!-- Copy: back sheet top-right, front sheet bottom-left (spec geometry). -->
<symbol id="copy" viewBox="0 0 24 24">
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="11" height="12" rx="2"/>
    <path d="M8 8V6A2 2 0 0 1 10 4H18A2 2 0 0 1 20 6V14A2 2 0 0 1 18 16H15"/>
  </g>
</symbol>

<!-- Copied: a plain tick. -->
<symbol id="check" viewBox="0 0 24 24">
  <path d="M5 12.5L10 17.5L19 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- Info: the PDF "can't be opened again" line in the Export dialog. -->
<symbol id="info" viewBox="0 0 24 24">
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5" fill="none"/>
    <path d="M12 11V16.5" fill="none"/>
    <circle cx="12" cy="7.75" r="1" fill="currentColor" stroke="none"/>
  </g>
</symbol>

<!-- Menu: the button at the left of the top bar that opens File, Edit, View and Help. -->
<symbol id="menu" viewBox="0 0 24 24">
  <path d="M4.5 7H19.5M4.5 12H19.5M4.5 17H19.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</symbol>

<!-- Close: the cross on a tab (drawn at 16 px). -->
<symbol id="close" viewBox="0 0 24 24">
  <path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</symbol>

<!-- Add: the new-tab button after the last tab. -->
<symbol id="add" viewBox="0 0 24 24">
  <path d="M12 5V19M5 12H19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</symbol>

<!-- Chevrons: scroll the tab strip when there are more tabs than fit. -->
<symbol id="chevron-left" viewBox="0 0 24 24">
  <path d="M14.5 6L8.5 12L14.5 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="chevron-right" viewBox="0 0 24 24">
  <path d="M9.5 6L15.5 12L9.5 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
</svg>
